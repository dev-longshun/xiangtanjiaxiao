spring:
  application:
    name: jiaxiao-backend
  
  # 激活的配置文件（dev: 开发环境, prod: 生产环境）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # MVC 配置
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB        # 单个文件最大 10MB
      max-request-size: 50MB     # 单次请求最大 50MB（支持多文件上传）

# MyBatis-Plus 配置（公共配置）
mybatis-plus:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  type-aliases-package: com.xiangtan.jiaxiao.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isActive  # 逻辑删除字段
      logic-delete-value: 0
      logic-not-delete-value: 1

# Swagger UI 配置（公共配置）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '用户接口'
      paths-to-match: '/api/**'
      paths-to-exclude: '/api/admin/**'
    - group: '管理接口'
      paths-to-match: '/api/admin/**'

# JWT 配置（公共配置）
jwt:
  header: Authorization
  prefix: Bearer

# 服务器配置（公共配置）
server:
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
