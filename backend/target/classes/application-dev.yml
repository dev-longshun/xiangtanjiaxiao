# 开发环境配置
spring:
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/jiaxiao?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}  # 开发环境默认密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境打印 SQL

# JWT 配置
jwt:
  secret: dev-secret-key-for-testing-only-change-in-production  # 开发环境测试密钥
  expiration: 86400000  # 24小时

# 微信配置（开发环境可使用测试账号）
wechat:
  appid: ${WECHAT_APPID:your-wechat-appid}
  secret: ${WECHAT_SECRET:your-wechat-secret}

# 文件上传配置
file:
  upload:
    base-path: uploads  # 开发环境使用相对路径
    review-image-path: reviews
    max-file-size: 5242880
    max-file-count: 9
    allowed-extensions: jpg,jpeg,png,gif,webp,bmp
    url-prefix: /uploads

# 服务器配置
server:
  port: 7070

# 日志配置（开发环境详细日志）
logging:
  level:
    root: INFO
    com.xiangtan.jiaxiao: DEBUG
    com.xiangtan.jiaxiao.mapper: DEBUG  # Mapper 层详细日志
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
